<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Oficial | ZUVAA - Ilumina tu estilo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --cream:#F2EAE1; --light:#FAF6F2; --black:#0D0C0B; --gold:#C5A059; --gold-l:#E2C792; --sage:#A3B5A6; --text:#1E1C1A; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--cream); color:var(--text); font-family:'Montserrat',sans-serif; }
.top-bar { background:var(--sage); color:var(--black); text-align:center; padding:8px; font-size:0.75rem; font-weight:600; text-transform:uppercase; }
header { background:var(--black); padding:14px 6%; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--gold); position:sticky; top:0; z-index:100; }
.brand { display:flex; align-items:center; gap:12px; text-decoration:none; }
.logo-img { width:50px; height:50px; border-radius:50%; object-fit:cover; border:1.5px solid var(--gold); }
.brand-title { font-family:'Cormorant Garamond',serif; color:var(--gold); font-size:1.6rem; letter-spacing:4px; display:block; line-height:1; }
.brand-slogan { font-family:'Great Vibes',cursive; color:var(--gold-l); font-size:1rem; }
.back-btn { color:var(--cream); text-decoration:none; font-size:0.8rem; border:1px solid var(--gold); padding:7px 15px; border-radius:20px; transition:0.3s; }
.back-btn:hover { background:var(--gold); color:var(--black); }
.hero-cat { background:var(--black); color:var(--cream); text-align:center; padding:40px 6%; border-bottom:2px solid var(--gold); }
.hero-cat h1 { font-family:'Cormorant Garamond',serif; font-size:2.5rem; color:var(--gold-l); }
.hero-cat p { font-family:'Great Vibes',cursive; font-size:1.8rem; color:var(--sage); }
.cats { display:flex; justify-content:center; gap:10px; padding:25px 5%; flex-wrap:wrap; }
.cat-btn { background:var(--light); border:1px solid var(--gold); padding:8px 18px; border-radius:25px; font-size:0.78rem; font-weight:600; cursor:pointer; transition:0.3s; }
.cat-btn.active, .cat-btn:hover { background:var(--black); color:var(--gold-l); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:25px; padding:10px 6% 60px; max-width:1300px; margin:auto; }
.card { background:var(--light); border:1px solid rgba(197,160,89,0.4); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; position:relative; box-shadow:0 5px 15px rgba(0,0,0,0.03); }
.tag { position:absolute; top:10px; left:10px; background:var(--gold); color:var(--black); font-size:0.65rem; font-weight:700; padding:4px 10px; border-radius:4px; text-transform:uppercase; z-index:2; }
.card img { width:100%; height:300px; object-fit:cover; }
.card-body { padding:16px; display:flex; flex-direction:column; gap:10px; flex-grow:1; }
.head-row { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(197,160,89,0.2); padding-bottom:8px; }
.title { font-family:'Cormorant Garamond',serif; font-size:1.35rem; font-weight:700; }
.price { color:var(--gold); font-weight:700; font-size:1.1rem; }
.opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.opt { display:flex; flex-direction:column; font-size:0.7rem; font-weight:600; }
.opt.full { grid-column:span 2; }
.opt select, .opt input { margin-top:3px; padding:7px; border:1px solid var(--gold); border-radius:5px; background:#fff; font-family:inherit; font-size:0.78rem; outline:none; }
.input-manual { display: none; margin-top: 5px; }
.btn-wa { margin-top:auto; background:var(--black); color:var(--gold-l); border:1px solid var(--gold); padding:12px; border-radius:6px; font-weight:600; font-size:0.78rem; text-transform:uppercase; cursor:pointer; transition:0.3s; }
.btn-wa:hover { background:var(--gold); color:var(--black); }
footer { background:var(--black); color:var(--cream); text-align:center; padding:25px; border-top:2px solid var(--gold); font-size:0.8rem; }
</style>
</head>
<body>

<div class="top-bar">✨ Elige tus detalles, tu estado y compra directo por WhatsApp ✨</div>

<header>
    <a href="index.html" class="brand">
        <img src="logo.jpg" alt="ZUVAA" class="logo-img">
        <div>
            <span class="brand-title">ZUVAA</span>
            <span class="brand-slogan">Ilumina tu estilo</span>
        </div>
    </a>
    <a href="index.html" class="back-btn">← Volver al Inicio</a>
</header>

<section class="hero-cat">
    <h1>Catálogo de Prendas</h1>
    <p>Ilumina tu estilo</p>
</section>

<div class="cats">
    <button class="cat-btn active" onclick="filtrar('todos',this)">Todas</button>
    <button class="cat-btn" onclick="filtrar('vestidos',this)">Vestidos</button>
    <button class="cat-btn" onclick="filtrar('blusas',this)">Blusas & Tops</button>
    <button class="cat-btn" onclick="filtrar('conjuntos',this)">Conjuntos</button>
    <button class="cat-btn" onclick="filtrar('pantalones',this)">Pantalones</button>
</div>

<div class="grid" id="product-list"></div>

<footer>
    <p><strong style="color:var(--gold);">ZUVAA</strong> — Ilumina tu estilo &copy; 2026</p>
</footer>

<script>
// ==========================================
// CAMBIA AQUÍ TU NÚMERO DE WHATSAPP (Sin el +)
// ==========================================
const WHATSAPP = "584125891414";

// Base de datos de productos
const productos = [
    { cat:"vestidos", nombre:"Vestido Gala Champagne", precio:45, tag:"Destacado", img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=600&q=80", colores:["Dorado Champagne","Negro Noche","Verde Salvia"] },
    { cat:"vestidos", nombre:"Vestido Noir ZUVAA", precio:52, tag:"Nuevo", img:"https://images.unsplash.com/photo-1539008835657-9e8e9680c956?auto=format&fit=crop&w=600&q=80", colores:["Negro Profundo","Vino Tinto","Beige Perla"] },
    { cat:"blusas", nombre:"Blusa Lazo Imperial", precio:29, tag:"Tendencia", img:"https://images.unsplash.com/photo-1564257631407-4deb1f99d992?auto=format&fit=crop&w=600&q=80", colores:["Blanco Marfil","Verde Menta","Rosa Empolvado"] },
    { cat:"conjuntos", nombre:"Conjunto Lino Crema", precio:38, tag:"Más Vendido", img:"https://images.unsplash.com/photo-1551163943-3f6a855d1153?auto=format&fit=crop&w=600&q=80", colores:["Crema Natural","Arena Dorado","Negro"] },
    { cat:"pantalones", nombre:"Pantalón Palazzo Imperial", precio:34, tag:"Exclusivo", img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=600&q=80", colores:["Camel Dorado","Negro","Blanco Hueso"] },
    { cat:"blusas", nombre:"Top Kors Satinado", precio:24, tag:"Nuevo", img:"https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=600&q=80", colores:["Champagne","Negro"] }
];

// Estados de Venezuela y sus respectivas ciudades principales
const venezuelaData = {
    "Amazonas": ["Puerto Ayacucho", "San Fernando de Atabapo", "Maroa"],
    "Anzoátegui": ["Barcelona", "Puerto La Cruz", "Lechería", "El Tigre", "Anaco", "Guanta"],
    "Apure": ["San Fernando de Apure", "Achaguas", "Elorza", "Guasdualito"],
    "Aragua": ["Maracay", "Turmero", "La Victoria", "Cagua", "Palo Negro", "Colonia Tovar"],
    "Barinas": ["Barinas", "Barinitas", "Sabaneta", "Socopó"],
    "Bolívar": ["Ciudad Bolívar", "Puerto Ordaz", "San Félix", "Upata", "Tumeremo"],
    "Carabobo": ["Valencia", "Guacara", "Puerto Cabello", "San Diego", "Naguanagua", "Los Guayos"],
    "Cojedes": ["San Carlos", "Tinaquillo"],
    "Delta Amacuro": ["Tucupita"],
    "Distrito Capital": ["Caracas"],
    "Falcón": ["Coro", "Punto Fijo", "Tucacas", "Chichiriviche"],
    "Guárico": ["San Juan de los Morros", "Calabozo", "Valle de la Pascua", "Altagracia de Orituco"],
    "Lara": ["Barquisimeto", "Quíbor", "Cabudare", "Carora", "El Tocuyo", "Siquisique"],
    "Mérida": ["Mérida", "El Vigía", "Ejido", "Tovar"],
    "Miranda": ["Los Teques", "Guatire", "Guarenas", "Baruta", "Chacao", "Petare", "San Antonio de los Altos"],
    "Monagas": ["Maturín", "Punta de Mata"],
    "Nueva Esparta": ["La Asunción", "Porlamar", "M Pampatar", "Juan Griego"],
    "Portuguesa": ["Guanare", "Acarigua", "Araure"],
    "Sucre": ["Cumaná", "Carúpano", "Güiria"],
    "Táchira": ["San Cristóbal", "Táriba", "Rubio", "San Antonio del Táchira", "Ureña"],
    "Trujillo": ["Trujillo", "Valera", "Boconó"],
    "La Guaira": ["La Guaira", "Maiquetía", "Catia La Mar", "Caraballeda"],
    "Yaracuy": ["San Felipe", "Yaritagua", "Chivacoa"],
    "Zulia": ["Maracaibo", "Cabimas", "Ciudad Ojeda", "San Francisco", "Machiques"]
};

const contenedor = document.getElementById("product-list");

// Generar las tarjetas de productos dinámicamente
productos.forEach((p, index) => {
    let opcionesEstados = `<option value="" disabled selected>Selecciona un estado...</option>`;
    for (let estado in venezuelaData) {
        opcionesEstados += `<option value="${estado}">${estado}</option>`;
    }

    contenedor.innerHTML += `
    <div class="card" data-cat="${p.cat}" data-name="${p.nombre}" data-price="${p.precio}">
        <span class="tag">${p.tag}</span>
        <img src="${p.img}" alt="${p.nombre}">
        <div class="card-body">
            <div class="head-row">
                <h3 class="title">${p.nombre}</h3>
                <span class="price">$${p.precio}.00</span>
            </div>
            <div class="opts">
                <div class="opt"><label>Talla:</label>
                    <select class="sz"><option>S</option><option selected>M</option><option>L</option><option>XL</option></select>
                </div>
                <div class="opt"><label>Cantidad:</label>
                    <input type="number" class="qt" value="1" min="1" max="20">
                </div>
                <div class="opt full"><label>Color:</label>
                    <select class="cl">${p.colores.map(c=>`<option>${c}</option>`).join('')}</select>
                </div>
                <div class="opt full"><label>Estado de Envío:</label>
                    <select class="st" onchange="actualizarCiudades(this, ${index})">
                        ${opcionesEstados}
                    </select>
                </div>
                <div class="opt full"><label>Ciudad / Municipio:</label>
                    <select class="ct" id="ciudad-${index}" onchange="verificarOtraCiudad(this, ${index})">
                        <option value="" disabled selected>Primero selecciona un estado...</option>
                    </select>
                    <input type="text" class="input-manual" id="input-manual-${index}" placeholder="Escribe el nombre de tu ciudad...">
                </div>
            </div>
            <button class="btn-wa" onclick="comprar(this, ${index})">📲 Comprar por WhatsApp</button>
        </div>
    </div>`;
});

// Función para actualizar las ciudades según el estado y añadir la opción manual
function actualizarCiudades(selectEstado, index) {
    const estadoSeleccionado = selectEstado.value;
    const selectCiudad = document.getElementById(`ciudad-${index}`);
    const inputManual = document.getElementById(`input-manual-${index}`);
    
    // Ocultar input manual al cambiar de estado
    inputManual.style.display = "none";
    inputManual.value = "";

    let ciudades = venezuelaData[estadoSeleccionado] || [];
    
    let opcionesCiudades = `<option value="" disabled selected>Selecciona tu ciudad...</option>`;
    ciudades.forEach(ciudad => {
        opcionesCiudades += `<option value="${ciudad}">${ciudad}</option>`;
    });
    // Agregamos la opción para escribir manualmente
    opcionesCiudades += `<option value="OTRA">Otra ciudad (Escribir manualmente)</option>`;
    
    selectCiudad.innerHTML = opcionesCiudades;
}

// Función para mostrar el campo de texto si eligen "Otra ciudad"
function verificarOtraCiudad(selectCiudad, index) {
    const inputManual = document.getElementById(`input-manual-${index}`);
    if (selectCiudad.value === "OTRA") {
        inputManual.style.display = "block";
        inputManual.focus();
    } else {
        inputManual.style.display = "none";
        inputManual.value = "";
    }
}

// Función de filtrado por categoría
function filtrar(cat, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.card').forEach(c => {
        c.style.display = (cat === 'todos' || c.dataset.cat === cat) ? 'flex' : 'none';
    });
}

// Función para armar el mensaje de WhatsApp estructurado
function comprar(btn, index) {
    const c = btn.closest('.card');
    const nombre = c.dataset.name;
    const precio = parseFloat(c.dataset.price);
    const talla = c.querySelector('.sz').value;
    const cant = parseInt(c.querySelector('.qt').value) || 1;
    const color = c.querySelector('.cl').value;
    const estado = c.querySelector('.st').value;
    const selectCiudad = c.querySelector('.ct');
    const inputManual = document.getElementById(`input-manual-${index}`);
    
    let ciudadFinal = "";

    if (!estado) {
        alert("📍 Por favor selecciona tu Estado de Envío.");
        c.querySelector('.st').focus();
        return;
    }

    if (!selectCiudad.value) {
        alert("📍 Por favor selecciona tu Ciudad / Municipio.");
        selectCiudad.focus();
        return;
    }

    if (selectCiudad.value === "OTRA") {
        if (!inputManual.value.trim()) {
            alert("✍️ Por favor escribe el nombre de tu ciudad en el campo de texto.");
            inputManual.focus();
            return;
        }
        ciudadFinal = inputManual.value.trim() + " (Escrita manual)";
    } else {
        ciudadFinal = selectCiudad.value;
    }

    const total = (precio * cant).toFixed(2);
    const msj = `¡Hola *ZUVAA*! ✨ Quiero realizar este pedido:\n\n👗 *Prenda:* ${nombre}\n🎨 *Color:* ${color}\n📏 *Talla:* ${talla}\n🛍️ *Cantidad:* ${cant}\n💵 *Total:* $${total}\n📍 *Estado:* ${estado}\n🏙️ *Ciudad:* ${ciudadFinal}\n\nQuedo atento(a) para los datos de pago y envío. ¡Gracias!`;
    
    window.open(`https://wa.me/${+584125891414}?text=${encodeURIComponent(msj)}`, '_blank');
}
</script>
</body>
</html>
